# Скопируйте в production.ini и укажите реальные адреса.
# Задайте реальное имя внешнего интерфейса для каждого узла.
[jump]
jump-node ansible_host=JUMP_PUBLIC_IP ansible_user=ADMIN_USER awg_external_interface=REPLACE_WITH_JUMP_INTERFACE

[gateway]
gateway-node ansible_host=GATEWAY_PUBLIC_IP ansible_user=ADMIN_USER awg_external_interface=REPLACE_WITH_GATEWAY_INTERFACE
